appId: com.localforwarder.desktop
productName: Local Forwarder
asar: true
files:
  - dist/**
  - dist-electron/**
  - package.json
  # electron-builder 产物也输出在 dist/ 下，必须排除以避免递归嵌套进 asar
  - "!dist/mac*/**"
  - "!dist/win*/**"
  - "!dist/*.{exe,dmg,zip,blockmap,yml,yaml}"
publish:
  provider: github
  owner: NanLiShuSheng
  repo: local-forwarder
  releaseType: release
afterSign: scripts/notarize.mjs
mac:
  extraResources:
    - from: resources/protocol
      to: protocol
      filter:
        - "**/*"
        - "!node/win-x64/**"
        - "!encode/h5encode-win-x86.exe"
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  extraResources:
    - from: resources/protocol
      to: protocol
      filter:
        - "**/*"
        - "!node/darwin-arm64/**"
        - "!encode/h5encode-mac-amd64"
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
