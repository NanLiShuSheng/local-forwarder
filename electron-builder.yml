appId: com.localforwarder.desktop
productName: Local Forwarder
asar: true
files:
  - dist/**
  - dist-electron/**
  - package.json
  # electron-builder 产物也输出在 dist/ 下，必须排除以避免递归嵌套进 asar
  - "!dist/mac*/**"
  - "!dist/win*/**"
  - "!dist/*.{exe,dmg,zip,blockmap,yml,yaml}"
extraResources:
  - from: resources/protocol
    to: protocol
    filter:
      - "**/*"
publish:
  provider: github
  owner: NanLiShuSheng
  repo: local-forwarder
  releaseType: release
afterSign: scripts/notarize.mjs
mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
