appId: com.localforwarder.desktop
productName: Local Forwarder
asar: true
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: resources/protocol
    to: protocol
    filter:
      - "**/*"
publish:
  provider: github
  owner: NanLiShuSheng
  repo: local-forwarder
  releaseType: release
afterSign: scripts/notarize.mjs
mac:
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  artifactName: ${productName} Setup ${version}.${ext}
