<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Forwarder · 深色色调原型</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050607; }
    iframe { display: block; width: 100vw; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="frame" title="Local Forwarder 深色工作台原型"></iframe>
  <script>
    const frame = document.getElementById('frame');
    const tone = new URLSearchParams(location.search).get('tone') || 'moss-ink';
    frame.src = `workbench-redesign.html?theme=dark&tone=${encodeURIComponent(tone)}&view=workbench`;
  </script>
</body>
</html>
