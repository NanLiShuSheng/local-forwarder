<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2d"/>
      <stop offset="1" stop-color="#111f34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82e8c5"/>
      <stop offset="1" stop-color="#54cda9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020711" flood-opacity=".28"/>
    </filter>
    <clipPath id="proxy-list-clip">
      <rect x="18" y="157" width="304" height="338" rx="10"/>
    </clipPath>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .muted { fill: #8396b2; }
      .text { fill: #eef5ff; }
      .soft { fill: #b9c8dc; }
      .panel { fill: #172841; stroke: #273d5a; stroke-width: 1; }
      .line { stroke: #2a405d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1440" height="68" fill="#101e33"/>
  <line x1="0" y1="68" x2="1440" y2="68" class="line"/>

  <!-- top bar -->
  <g class="font">
    <circle cx="34" cy="34" r="16" fill="url(#accent)"/>
    <path d="M29 39l10-10M32 29h7v7" fill="none" stroke="#092019" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="31" class="text" font-size="17" font-weight="700">本地转发工具</text>
    <text x="62" y="49" class="muted" font-size="11">多代理实例管理</text>
    <text x="1232" y="39" class="muted" font-size="12">当前运行</text>
    <circle cx="1318" cy="34" r="5" fill="#79e2c0"/>
    <text x="1331" y="39" fill="#79e2c0" font-size="13" font-weight="600">2 个代理运行中</text>
  </g>

  <!-- sidebar -->
  <rect x="0" y="69" width="340" height="831" fill="#101d31"/>
  <line x1="340" y1="69" x2="340" y2="900" class="line"/>
  <g class="font">
    <text x="26" y="103" class="text" font-size="18" font-weight="700">代理实例</text>
    <text x="26" y="125" class="muted" font-size="11">点击代理即可切换当前工作环境</text>
    <rect x="246" y="91" width="70" height="30" rx="8" fill="url(#accent)"/>
    <text x="281" y="111" text-anchor="middle" fill="#092019" font-size="12" font-weight="700">＋ 新增</text>

    <!-- fixed-height proxy list -->
    <rect x="18" y="148" width="304" height="356" rx="12" fill="#0d192b" stroke="#223650"/>
    <text x="30" y="169" class="muted" font-size="10">代理列表 · 最大高度 356px</text>
    <g clip-path="url(#proxy-list-clip)">
      <rect x="25" y="181" width="280" height="58" rx="9" fill="#203653" stroke="#79e2c0" stroke-width="1.4"/>
      <rect x="25" y="181" width="4" height="58" rx="2" fill="#79e2c0"/>
      <circle cx="45" cy="200" r="4.5" fill="#79e2c0"/>
      <text x="58" y="204" class="text" font-size="13" font-weight="700">行情代理</text>
      <text x="290" y="204" class="muted mono" font-size="10" text-anchor="end">:8080</text>
      <text x="39" y="224" class="soft mono" font-size="10">jy · 60.12.9.58:7778</text>

      <rect x="25" y="247" width="280" height="58" rx="9" class="panel"/>
      <circle cx="45" cy="266" r="4.5" fill="#79e2c0"/>
      <text x="58" y="270" class="text" font-size="13" font-weight="700">业务办理代理</text>
      <text x="290" y="270" class="muted mono" font-size="10" text-anchor="end">:8081</text>
      <text x="39" y="290" class="soft mono" font-size="10">jy · 123.103.83.86:7779</text>

      <rect x="25" y="313" width="280" height="58" rx="9" class="panel"/>
      <circle cx="45" cy="332" r="4.5" fill="#8496b2"/>
      <text x="58" y="336" class="text" font-size="13" font-weight="700">测试代理</text>
      <text x="290" y="336" class="muted mono" font-size="10" text-anchor="end">:8082</text>
      <text x="39" y="356" class="soft mono" font-size="10">jy · test.example.com:7778</text>

      <rect x="25" y="379" width="280" height="58" rx="9" class="panel"/>
      <circle cx="45" cy="398" r="4.5" fill="#79e2c0"/>
      <text x="58" y="402" class="text" font-size="13" font-weight="700">生产备份代理</text>
      <text x="290" y="402" class="muted mono" font-size="10" text-anchor="end">:8083</text>
      <text x="39" y="422" class="soft mono" font-size="10">jy · 10.24.8.16:7780</text>

      <rect x="25" y="445" width="280" height="58" rx="9" class="panel"/>
      <circle cx="45" cy="464" r="4.5" fill="#8496b2"/>
      <text x="58" y="468" class="text" font-size="13" font-weight="700">联调代理</text>
      <text x="290" y="468" class="muted mono" font-size="10" text-anchor="end">:8084</text>
      <text x="39" y="488" class="soft mono" font-size="10">jy · 10.24.8.17:7780</text>

      <rect x="25" y="511" width="280" height="58" rx="9" class="panel"/>
      <circle cx="45" cy="530" r="4.5" fill="#8496b2"/>
      <text x="58" y="534" class="text" font-size="13" font-weight="700">临时代理</text>
      <text x="290" y="534" class="muted mono" font-size="10" text-anchor="end">:8085</text>
      <text x="39" y="554" class="soft mono" font-size="10">jy · 10.24.8.18:7780</text>
    </g>
    <!-- scrollbar communicates max-height behavior -->
    <rect x="313" y="181" width="4" height="310" rx="2" fill="#1d3049"/>
    <rect x="313" y="190" width="4" height="112" rx="2" fill="#6b819d"/>
    <text x="30" y="522" class="muted" font-size="10">↑ 列表超出后在此区域内滚动</text>

    <line x1="26" y1="550" x2="314" y2="550" class="line"/>
    <text x="26" y="579" class="muted" font-size="10" letter-spacing="1.1">功能</text>

    <!-- original tabs moved below proxy list -->
    <rect x="18" y="595" width="304" height="34" rx="8" fill="#1d2c43"/>
    <rect x="18" y="595" width="3" height="34" rx="1.5" fill="#79e2c0"/>
    <text x="37" y="617" class="text" font-size="13" font-weight="600">概览</text>

    <text x="37" y="657" class="soft" font-size="13">↗ 请求</text>
    <text x="37" y="697" class="soft" font-size="13">↔ 字符串</text>
    <text x="37" y="737" class="soft" font-size="13">⌘ 本地变量</text>
    <text x="37" y="777" class="soft" font-size="13">▣ 登录缓存</text>
    <text x="37" y="817" class="soft" font-size="13">▤ 加密</text>
    <text x="175" y="657" class="soft" font-size="13">☷ 日志</text>
    <text x="175" y="697" class="soft" font-size="13">⚙ 设置</text>
  </g>

  <!-- main content -->
  <g class="font">
    <text x="386" y="108" class="muted" font-size="11">代理实例 / 概览</text>
    <text x="386" y="149" class="text" font-size="28" font-weight="750">行情代理</text>
    <rect x="386" y="169" width="72" height="26" rx="13" fill="#173c3a"/>
    <circle cx="401" cy="182" r="4" fill="#79e2c0"/>
    <text x="412" y="187" fill="#79e2c0" font-size="11" font-weight="600">运行中</text>
    <text x="486" y="187" class="muted" font-size="12">当前代理 · 127.0.0.1:8080</text>
    <rect x="1153" y="162" width="94" height="36" rx="8" fill="#243b57" stroke="#3b5471"/>
    <text x="1200" y="185" text-anchor="middle" class="soft" font-size="13">编辑配置</text>
    <rect x="1258" y="162" width="92" height="36" rx="8" fill="#263647" stroke="#f19a8b"/>
    <text x="1304" y="185" text-anchor="middle" fill="#f2a99b" font-size="13" font-weight="600">停止代理</text>

    <rect x="386" y="229" width="226" height="105" rx="12" class="panel" filter="url(#shadow)"/>
    <text x="410" y="259" class="muted" font-size="12">本地监听端口</text>
    <text x="410" y="298" class="text mono" font-size="26" font-weight="700">8080</text>
    <text x="558" y="298" fill="#79e2c0" font-size="11">可访问</text>
    <rect x="628" y="229" width="226" height="105" rx="12" class="panel" filter="url(#shadow)"/>
    <text x="652" y="259" class="muted" font-size="12">jy 上游地址</text>
    <text x="652" y="297" class="soft mono" font-size="15">60.12.9.58:7778</text>
    <text x="652" y="317" class="muted" font-size="11">TCP / TZT</text>
    <rect x="870" y="229" width="226" height="105" rx="12" class="panel" filter="url(#shadow)"/>
    <text x="894" y="259" class="muted" font-size="12">累计请求</text>
    <text x="894" y="298" class="text" font-size="26" font-weight="700">1,284</text>
    <text x="1028" y="298" fill="#79e2c0" font-size="11">成功率 99.4%</text>
    <rect x="1112" y="229" width="238" height="105" rx="12" class="panel" filter="url(#shadow)"/>
    <text x="1136" y="259" class="muted" font-size="12">登录缓存</text>
    <text x="1136" y="298" class="text" font-size="22" font-weight="700">81 项</text>
    <text x="1136" y="317" class="muted" font-size="11">当前代理独立保存</text>

    <rect x="386" y="361" width="964" height="218" rx="14" class="panel"/>
    <text x="412" y="397" class="text" font-size="16" font-weight="700">当前代理配置</text>
    <text x="412" y="421" class="muted" font-size="11">切换左侧代理后，此处内容随选中实例更新</text>
    <line x1="412" y1="439" x2="1324" y2="439" class="line"/>
    <text x="412" y="472" class="muted" font-size="12">本地访问地址</text>
    <text x="624" y="472" class="soft mono" font-size="13">http://127.0.0.1:8080</text>
    <text x="412" y="512" class="muted" font-size="12">jy 上游地址</text>
    <text x="624" y="512" class="soft mono" font-size="13">tcp://60.12.9.58:7778</text>
    <text x="908" y="472" class="muted" font-size="12">项目目录</text>
    <text x="1042" y="472" class="soft" font-size="12">/Users/hdw/Desktop/market-h5</text>
    <text x="908" y="512" class="muted" font-size="12">缓存目录</text>
    <text x="1042" y="512" class="soft" font-size="12">实例独立缓存</text>
    <rect x="1244" y="531" width="80" height="28" rx="7" fill="#223a55"/>
    <text x="1284" y="550" text-anchor="middle" fill="#9bb0ca" font-size="11">查看配置</text>

    <rect x="386" y="606" width="964" height="230" rx="14" class="panel"/>
    <text x="412" y="642" class="text" font-size="16" font-weight="700">运行日志</text>
    <text x="1267" y="642" class="muted" font-size="11">仅显示当前代理</text>
    <line x1="412" y1="663" x2="1324" y2="663" class="line"/>
    <text x="412" y="695" class="muted mono" font-size="11">10:24:31</text>
    <text x="506" y="695" fill="#79e2c0" font-size="11">INFO</text>
    <text x="562" y="695" class="soft mono" font-size="11">Forwarding service started on 127.0.0.1:8080</text>
    <text x="412" y="727" class="muted mono" font-size="11">10:24:36</text>
    <text x="506" y="727" fill="#8fc7ff" font-size="11">HTTP</text>
    <text x="562" y="727" class="soft mono" font-size="11">GET /quote/index.html → 200 · 42ms</text>
    <text x="412" y="759" class="muted mono" font-size="11">10:24:39</text>
    <text x="506" y="759" fill="#8fc7ff" font-size="11">TCP</text>
    <text x="562" y="759" class="soft mono" font-size="11">reqxml → 60.12.9.58:7778 · 86ms</text>
    <text x="412" y="791" class="muted mono" font-size="11">10:24:42</text>
    <text x="506" y="791" fill="#79e2c0" font-size="11">CACHE</text>
    <text x="562" y="791" class="soft mono" font-size="11">app.js.d hit · decoded successfully</text>
  </g>
</svg>
