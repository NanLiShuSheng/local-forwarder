name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:release:tag
      - run: npm run package:release:win:x64
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: node scripts/smoke-packaged.mjs
      - run: node scripts/smoke-win-resources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: local-forwarder-windows-release
          if-no-files-found: error
          path: |
            dist/Local-Forwarder-Setup-*.exe
            dist/Local-Forwarder-Setup-*.exe.blockmap
            dist/latest.yml

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-forwarder-windows-release
          path: release-assets/windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/windows/*.exe \
            release-assets/windows/*.exe.blockmap \
            release-assets/windows/latest.yml \
            --verify-tag \
            --title "Local Forwarder $GITHUB_REF_NAME" \
            --generate-notes
