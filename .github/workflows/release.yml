name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:release:tag
      - run: npm run package:release:win:x64
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: node scripts/smoke-packaged.mjs
      - run: node scripts/smoke-win-resources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: local-forwarder-windows-release
          if-no-files-found: error
          path: |
            dist/Local-Forwarder-Setup-*.exe
            dist/Local-Forwarder-Setup-*.exe.blockmap
            dist/latest.yml

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:release:tag
      - name: Build macOS packages
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done
          npm run package:release:mac:x64-arm64
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-forwarder-macos-release
          if-no-files-found: error
          path: |
            release/Local-Forwarder-*-mac.dmg
            dist/Local-Forwarder-*-mac.zip
            dist/Local-Forwarder-*-mac.zip.blockmap
            dist/latest-mac.yml
            dist/mac-update.json

  publish:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-forwarder-windows-release
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: local-forwarder-macos-release
          path: release-assets/macos
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets/macos -mindepth 2 -type f -exec cp {} release-assets/macos/ \;
          gh release create "$GITHUB_REF_NAME" \
            release-assets/windows/*.exe \
            release-assets/windows/*.exe.blockmap \
            release-assets/windows/latest.yml \
            release-assets/macos/*.dmg \
            release-assets/macos/*.zip \
            release-assets/macos/*.zip.blockmap \
            release-assets/macos/latest-mac.yml \
            release-assets/macos/mac-update.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Local Forwarder $GITHUB_REF_NAME" \
            --generate-notes
